name: CI

# Roda a cada PR e a cada push na main. Se falhar, o PR não deve ser juntado.
on:
  pull_request:
  push:
    branches: [main]

# O token do fluxo só lê o repositório.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # Ações fixadas pelo código (SHA), não pela etiqueta, que pode ser movida.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # `npm run build` roda `tsc -b` (site, configuração e Worker) e o build do Vite.
      - name: Build e checagem de tipos
        run: npm run build
